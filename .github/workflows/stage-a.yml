name: Phase 4 comparison verification

on:
  workflow_dispatch:
    inputs:
      version_a_run:
        description: Version A simulation run ID
        required: true
        type: string
      version_a_attempt:
        description: Version A simulation attempt
        required: true
        type: string
        default: '1'
      version_b_run:
        description: Version B simulation run ID
        required: true
        type: string
      version_b_attempt:
        description: Version B simulation attempt
        required: true
        type: string
        default: '1'

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  ARCHIVE_BRANCH: codex/phase-4-meren-comparison

jobs:
  compare:
    name: Build the comparison dashboard
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      summary-attempt: ${{ steps.compare.outputs.attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download and check the two simulation attempts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          A_RUN: ${{ inputs.version_a_run }}
          A_ATTEMPT: ${{ inputs.version_a_attempt }}
          B_RUN: ${{ inputs.version_b_run }}
          B_ATTEMPT: ${{ inputs.version_b_attempt }}
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/codex/phase-4-compare-rehearsal" ]]; then
            printf 'Select the %s branch to build and archive a comparison.\n' "$ARCHIVE_BRANCH" >&2
            exit 2
          fi
          download_attempt() {
            local run_id="$1" attempt="$2" destination="$3"
            if [[ ! "$run_id" =~ ^[1-9][0-9]*$ || ! "$attempt" =~ ^[1-9][0-9]*$ ]]; then
              printf 'Run IDs and attempts must be positive decimal integers.\n' >&2
              return 2
            fi
            local metadata
            metadata=$(gh api "repos/$GH_REPO/actions/runs/$run_id/attempts/$attempt")
            if ! jq -e --arg repo "$GH_REPO" '
              .event == "workflow_dispatch" and .path == ".github/workflows/simulate.yml"
              and .head_repository.full_name == $repo and .status == "completed"
            ' <<< "$metadata" > /dev/null; then
              printf 'Run %s attempt %s must be a completed Commander batch from this repository.\n' "$run_id" "$attempt" >&2
              return 2
            fi
            gh run download "$run_id" --repo "$GH_REPO" \
              --name "commander-batch-$run_id-attempt-$attempt" --dir "$destination"
            if ! jq -e --arg run "$run_id" --arg attempt "$attempt" '
              .run.run_id == $run and .run.run_attempt == $attempt
            ' "$destination/batch/results.json" > /dev/null; then
              printf 'Downloaded results do not identify run %s attempt %s.\n' "$run_id" "$attempt" >&2
              return 2
            fi
          }
          download_attempt "$A_RUN" "$A_ATTEMPT" "$RUNNER_TEMP/version-a"
          download_attempt "$B_RUN" "$B_ATTEMPT" "$RUNNER_TEMP/version-b"
      - name: Build the A/B dashboard
        id: compare
        run: |
          mkdir -p "$RUNNER_TEMP/commander-comparison"
          python3 -B -m scripts.compare_reports \
            --version-a "$RUNNER_TEMP/version-a/batch/results.json" \
            --version-b "$RUNNER_TEMP/version-b/batch/results.json" \
            --output "$RUNNER_TEMP/commander-comparison/summary.md"
          printf 'attempt=%s\n' "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - name: Upload the comparison
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: commander-comparison-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/commander-comparison/summary.md
          if-no-files-found: error

  archive:
    name: Prepare comparison archive pull request
    needs: compare
    if: github.ref == 'refs/heads/codex/phase-4-compare-rehearsal'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Download the comparison artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.compare.outputs.artifact-id }}
          path: ${{ runner.temp }}/archive-artifact
      - name: Publish the comparison branch and pull request link
        env:
          SUMMARY_ATTEMPT: ${{ needs.compare.outputs.summary-attempt }}
        run: |
          report_branch=$(python3 -B scripts/archive_report.py \
            --base-branch "$ARCHIVE_BRANCH" --run-id "$GITHUB_RUN_ID" --attempt "$SUMMARY_ATTEMPT" \
            --summary "$RUNNER_TEMP/archive-artifact/summary.md")
          if [[ -z "$report_branch" ]]; then
            printf 'The Markdown comparison is already archived on `%s`.\n' "$ARCHIVE_BRANCH" >> "$GITHUB_STEP_SUMMARY"
          else
            printf 'Published comparison branch: %s\n' "$report_branch"
            printf '[Open the archive pull request](%s/%s/compare/%s...%s?expand=1) and wait for CI Verify before merging.\n' \
              "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$ARCHIVE_BRANCH" "$report_branch" >> "$GITHUB_STEP_SUMMARY"
          fi
