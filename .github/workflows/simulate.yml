name: Commander batch simulation
run-name: Phase 4 simulation verification · ${{ inputs.lineup }} · ${{ inputs.games }} requested

on:
  workflow_dispatch:
    inputs:
      lineup:
        description: Commander lineup
        required: true
        type: choice
        default: baseline
        options:
          - baseline
          - graveyard-recursion
          - spellslinger
          - meren-extra-swamp
      games:
        description: Number of games (1 to 10)
        required: true
        type: number
        default: 10
      goal_seat:
        description: Goal deck seat (auto uses the lineup's highlighted deck)
        required: true
        type: choice
        default: auto
        options:
          - auto
          - '1'
          - '2'
          - '3'
          - '4'

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  ARCHIVE_BRANCH: codex/phase-4-meren-comparison

jobs:
  simulate:
    name: Run Commander batch
    runs-on: ubuntu-24.04
    # Ten 12-minute process deadlines leave 20 minutes for setup and reporting.
    timeout-minutes: 140
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      summary-attempt: ${{ steps.summary.outputs.attempt }}
    env:
      GAMES: ${{ inputs.games }}
      LINEUP: ${{ inputs.lineup }}
      GOAL_SEAT: ${{ inputs.goal_seat || 'auto' }}
      TEMURIN_VERSION: '17.0.21+9'
    steps:
      - name: Prepare evidence and validate dispatch
        run: |
          EVIDENCE_DIR="$RUNNER_TEMP/commander-batch-evidence"
          mkdir -p -- "$EVIDENCE_DIR"
          printf 'EVIDENCE_DIR=%s\n' "$EVIDENCE_DIR" >> "$GITHUB_ENV"
          printf 'Commit: %s\nRun ID: %s\nAttempt: %s\nRunner OS: %s\nLineup: %s\nRequested games: %s\nGoal seat: %s\n' \
            "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$RUNNER_OS" "$LINEUP" "$GAMES" "$GOAL_SEAT" > "$EVIDENCE_DIR/run.txt"
          if [[ "$GITHUB_REF" != "refs/heads/codex/phase-4-sim-rehearsal" ]]; then
            printf 'Select the %s branch to run and archive a batch.\n' "$ARCHIVE_BRANCH" | tee -a "$EVIDENCE_DIR/run.txt" >&2
            exit 2
          fi
          if [[ ! "$GAMES" =~ ^([1-9]|10)$ ]]; then
            printf 'Game count must be a whole number from 1 to 10.\n' | tee -a "$EVIDENCE_DIR/run.txt" >&2
            exit 2
          fi
          case "$GOAL_SEAT" in
            auto|1|2|3|4) ;;
            *) printf 'Goal seat must be auto or a number from 1 to 4.\n' | tee -a "$EVIDENCE_DIR/run.txt" >&2; exit 2 ;;
          esac
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: ${{ env.TEMURIN_VERSION }}
      - name: Verify Java and install pinned Forge
        run: |
          java -version > "$EVIDENCE_DIR/java-version.log" 2>&1
          grep -F "(build $TEMURIN_VERSION)" "$EVIDENCE_DIR/java-version.log"
          bash scripts/setup_forge.sh "$RUNNER_TEMP/forge" 2>&1 | tee "$EVIDENCE_DIR/forge-setup.log"
      - name: Play the requested games
        run: |
          goal_args=()
          if [[ "$GOAL_SEAT" != auto ]]; then
            goal_args=(--goal-seat "$GOAL_SEAT")
          fi
          python3 -B -m scripts.stage_b \
            --forge-dir "$RUNNER_TEMP/forge" --output-dir "$EVIDENCE_DIR/batch" --games "$GAMES" \
            --lineup "$LINEUP" "${goal_args[@]}"
      - name: Identify the attempt that produced the summary
        id: summary
        if: ${{ !cancelled() }}
        run: |
          if [[ -s "$EVIDENCE_DIR/batch/summary.md" ]]; then
            printf 'attempt=%s\n' "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
          fi
      - name: Upload reports and available diagnostics
        id: upload
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: commander-batch-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: ${{ env.EVIDENCE_DIR }}
          if-no-files-found: error

  archive:
    name: Prepare Markdown summary pull request
    needs: simulate
    if: >-
      ${{ !cancelled() &&
          github.ref == 'refs/heads/codex/phase-4-sim-rehearsal' &&
          needs.simulate.outputs.artifact-id != '' &&
          needs.simulate.outputs.summary-attempt != '' }}
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Download the simulation artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.simulate.outputs.artifact-id }}
          path: ${{ runner.temp }}/archive-artifact
      - name: Publish the report branch and pull request link
        env:
          SUMMARY_ATTEMPT: ${{ needs.simulate.outputs.summary-attempt }}
        run: |
          report_branch=$(python3 -B scripts/archive_report.py \
            --base-branch "$ARCHIVE_BRANCH" --run-id "$GITHUB_RUN_ID" --attempt "$SUMMARY_ATTEMPT" \
            --summary "$RUNNER_TEMP/archive-artifact/batch/summary.md")
          if [[ -z "$report_branch" ]]; then
            printf 'The Markdown summary is already archived on `%s`.\n' "$ARCHIVE_BRANCH" >> "$GITHUB_STEP_SUMMARY"
          else
            printf 'Published report branch: %s\n' "$report_branch"
            printf '[Open the archive pull request](%s/%s/compare/%s...%s?expand=1) and wait for CI Verify before merging.\n' \
              "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$ARCHIVE_BRANCH" "$report_branch" >> "$GITHUB_STEP_SUMMARY"
          fi
