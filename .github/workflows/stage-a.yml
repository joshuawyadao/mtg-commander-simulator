name: Stage A Commander smoke test

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/stage-a.yml'
      - '.github/workflows/simulate.yml'
      - 'decks/stage-a/**'
      - 'scripts/**'
      - 'tests/**'

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  verify:
    name: CI Verify
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check simulation and archive scripts
        run: |
          bash -n scripts/setup_forge.sh
          python3 -B -m unittest discover -s tests -v

  smoke:
    name: Play one four-player Commander game
    if: github.event_name == 'workflow_dispatch'
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      TEMURIN_VERSION: '17.0.21+9'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare run evidence
        run: |
          output="$RUNNER_TEMP/stage-a-evidence"
          mkdir -p -- "$output"
          printf 'Commit: %s\nRun ID: %s\nAttempt: %s\nRunner OS: %s\n' \
            "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$RUNNER_OS" > "$output/run.txt"
          uname -a >> "$output/run.txt"
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: ${{ env.TEMURIN_VERSION }}
      - name: Install verified Forge desktop release
        run: |
          java -version > "$RUNNER_TEMP/stage-a-evidence/java-version.log" 2>&1
          grep -F "(build $TEMURIN_VERSION)" "$RUNNER_TEMP/stage-a-evidence/java-version.log"
          bash scripts/setup_forge.sh "$RUNNER_TEMP/forge" 2>&1 | tee "$RUNNER_TEMP/stage-a-evidence/forge-setup.log"
      - name: Verify fixtures and play one game
        run: |
          python3 -B scripts/stage_a.py --forge-dir "$RUNNER_TEMP/forge" \
            --output-dir "$RUNNER_TEMP/stage-a-evidence"
      - name: Upload Stage A logs and evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stage-a-evidence-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/stage-a-evidence/
          if-no-files-found: error
